<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Dia dos Pais</title>
<style>
  :root{
    --bg:#0f1115;
    --panel:#181a20;
    --sidebar:#141519;
    --border:#2a2d34;
    --text:#e8e8e6;
    --muted:#8b8d94;
    --accent:#d97757;
    --accent2:#4f9eff;
    --green:#3fb950;
    --pill:#2a2d34;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .app{
    display:flex;
    height:100vh;
    width:100vw;
  }

  /* ---- sidebar ---- */
  .sidebar{
    width:260px;
    flex:0 0 auto;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:14px 10px;
  }
  .sidebar .row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    border-radius:7px;
    color:var(--muted);
    font-size:13.5px;
    cursor:default;
  }
  .sidebar .row.active{
    background:#20232a;
    color:var(--text);
  }
  .sidebar .icon{
    width:16px;text-align:center;font-size:14px;
  }
  .sidebar .section-title{
    color:#5c5f66;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:14px 10px 6px;
  }
  .sidebar .divider{
    height:1px;background:var(--border);margin:10px 4px;
  }
  .sidebar .thread{
    display:flex;align-items:center;gap:8px;
    padding:7px 10px;border-radius:7px;
    font-size:13px;color:#c9cacd;
  }
  .sidebar .thread .dot-status{
    width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto;
  }
  .sidebar .thread.selected{background:#20232a;color:#fff;}
  .sidebar-bottom{
    margin-top:auto;
    display:flex;align-items:center;gap:8px;
    padding:10px;
    font-size:13px;color:var(--muted);
    border-top:1px solid var(--border);
  }
  .sidebar-bottom .avatar-mini{
    width:22px;height:22px;border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#1a1a1a;font-weight:700;
  }

  /* ---- main ---- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 20px;
    border-bottom:1px solid var(--border);
    font-size:13px;
    color:var(--muted);
  }
  .topbar .file-icon{font-size:14px;}
  .topbar .title{color:var(--text);font-weight:500;}
  .topbar .path-badge{
    background:#20232a;border:1px solid var(--border);
    color:var(--muted);
    padding:1px 7px;border-radius:5px;font-size:11.5px;
  }

  .chat{
    flex:1;
    overflow-y:auto;
    padding:28px 0 20px;
  }
  .chat-inner{
    max-width:780px;
    margin:0 auto;
    padding:0 24px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .msg-assistant{
    animation:fadeIn .35s ease;
    font-size:14.5px;
    line-height:1.65;
    color:var(--text);
  }
  .msg-assistant p{margin:0 0 10px;white-space:pre-wrap;}
  .msg-assistant p:last-child{margin-bottom:0;}

  .msg-user-row{
    display:flex;
    justify-content:flex-end;
    animation:fadeIn .35s ease;
  }
  .msg-user{
    background:var(--pill);
    color:var(--text);
    padding:9px 15px;
    border-radius:14px;
    font-size:14.5px;
    max-width:70%;
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  @keyframes fadeIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }

  .tool-block{
    border:1px solid var(--border);
    background:#14161a;
    border-radius:9px;
    padding:10px 14px;
    margin:10px 0;
    font-size:13px;
    color:var(--muted);
  }
  .tool-block .tool-head{
    display:flex;align-items:center;gap:8px;cursor:default;
  }
  .tool-block .caret{color:#5c5f66;font-size:11px;transition:transform .2s;}
  .spinner{
    width:12px;height:12px;
    border:2px solid #30363d;
    border-top-color:var(--accent2);
    border-radius:50%;
    animation:spin .7s linear infinite;
    flex:0 0 auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .tool-block.done .spinner{display:none;}
  .tool-block.done .tool-head::before{
    content:"✓";color:var(--green);font-weight:bold;font-size:12px;
  }

  .cursor{
    display:inline-block;
    width:7px;height:15px;
    background:var(--accent);
    margin-left:2px;
    vertical-align:middle;
    animation:blink 1s step-start infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .heart{color:var(--accent);}

  /* ---- input bar ---- */
  .input-area{
    padding:14px 24px 20px;
    border-top:1px solid var(--border);
    background:var(--bg);
  }
  .input-shell{
    max-width:780px;
    margin:0 auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px 12px;
  }
  .input-shell textarea{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    max-height:120px;
  }
  .input-shell textarea::placeholder{color:var(--muted);}
  .input-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:6px;
  }
  .model-pill{
    display:flex;align-items:center;gap:6px;
    background:#3a2f1f;
    color:#e8b878;
    border:none;
    padding:5px 11px;
    border-radius:7px;
    font-size:12.5px;
    font-weight:600;
  }
  .toolbar-right{
    display:flex;align-items:center;gap:10px;
    color:var(--muted);
    font-size:12px;
  }
  .send-btn{
    background:var(--accent);
    border:none;
    color:#1a1a1a;
    width:28px;height:28px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:14px;
  }
  .send-btn:disabled{opacity:.4;cursor:not-allowed;}
  .hint{
    text-align:center;
    color:#5c5f66;
    font-size:11px;
    margin-top:9px;
  }

  @media (max-width:720px){
    .sidebar{display:none;}
  }

  #confettiCanvas{
    position:fixed;
    top:0;left:0;
    width:100vw;height:100vh;
    pointer-events:none;
    z-index:9999;
    display:none;
  }

  .inspo-badge{
    align-self:center;
    margin:6px auto 0;
    background:linear-gradient(135deg,#2a1f3a,#1f2a3a);
    border:1px solid var(--border);
    color:#fff;
    padding:10px 22px;
    border-radius:999px;
    font-size:15px;
    font-weight:600;
    text-align:center;
    opacity:0;
    transform:translateY(8px) scale(.95);
    transition:opacity .5s ease, transform .5s ease;
  }
  .inspo-badge.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  .share-row{
    display:flex;
    justify-content:center;
    margin-top:10px;
  }
  .share-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .share-btn:hover{
    background:#20232a;
    color:var(--text);
    border-color:#3a3d44;
  }
</style>
</head>
<body>
<canvas id="confettiCanvas"></canvas>
<div class="app">

  <div class="sidebar">
    <div class="row active"><span class="icon">🏠</span> Início</div>
    <div class="row"><span class="icon">💬</span> Code</div>
    <div class="section-title">cronometro-natacao</div>
    <div class="thread selected"><span class="dot-status"></span> Feliz Dia dos Pais</div>
    <div class="thread"><span class="dot-status" style="background:#5c5f66"></span> Cronômetro natação</div>
    <div class="thread"><span class="dot-status" style="background:#5c5f66"></span> Site de portfólio</div>
    <div class="divider"></div>
    <div class="sidebar-bottom">
      <div class="avatar-mini">P</div>
      <span>Papai · Herói</span>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <span class="file-icon">💻</span>
      <span class="title">Feliz Dia dos Pais</span>
      <span class="path-badge">para-o-melhor-pai</span>
    </div>

    <div class="chat" id="chat">
      <div class="chat-inner" id="chatInner">
        <div class="msg-assistant">
          <p><span id="intro"></span><span class="cursor" id="introCursor"></span></p>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-shell">
        <textarea id="userInput" rows="1" placeholder="Escreve algo pro Henrique aqui..."></textarea>
        <div class="input-toolbar">
          <div class="model-pill">✨ Automático</div>
          <div class="toolbar-right">
            <span>Sonnet 5</span>
            <button class="send-btn" id="sendBtn">➤</button>
          </div>
        </div>
      </div>
      <div class="hint">feito com <span class="heart">♥</span> por um filho que também é dev</div>
    </div>
  </div>

</div>

<script>
const chat = document.getElementById('chat');
const chatInner = document.getElementById('chatInner');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

const introText = "Olá! Essa página foi feita especialmente pra hoje.\n\nEscreva alguma coisa sobre o Dia dos Pais aí embaixo e manda ver.";
let introI = 0;
function typeIntro(){
  const el = document.getElementById('intro');
  if(introI <= introText.length){
    el.textContent = introText.slice(0, introI);
    introI++;
    setTimeout(typeIntro, 16);
  } else {
    document.getElementById('introCursor').remove();
  }
}
typeIntro();

const responses = [
`Pai, feliz Dia dos Pais! ❤️

Queria te agradecer por tudo que você faz por mim e por todos os momentos que a gente passa junto. Às vezes são coisas simples, mas que para mim significam muito.

Eu gosto muito dos sábados quando você me leva para comer pastel na feira, das vezes que a gente fica junto conversando, fazendo alguma coisa ou simplesmente passando um tempo um com o outro. São esses momentos que eu vou guardar e lembrar por muito tempo.

Também gosto muito de tudo que você me ensina. Não só coisas práticas, mas também coisas da vida, os conselhos que você me dá e tudo que eu vou aprendendo com você conforme vou crescendo.

Obrigado também por sempre me apoiar na natação, nos meus treinos, nas competições e nos meus sonhos. Eu sei que às vezes é uma rotina cansativa e que exige bastante de todo mundo, e sou muito grato por você estar comigo nessa caminhada e acreditar em mim.

Mas, acima de qualquer esporte ou conquista, o que mais importa para mim é ter você como meu pai. Poder passar tempo com você, rir com você, aprender com você e criar essas lembranças juntos.

Espero que a gente ainda tenha muitos sábados de pastel na feira, muitas conversas, risadas, passeios e momentos juntos.

Eu te amo muito, pai. Obrigado por tudo e por ser quem você é para mim. ❤️

Feliz Dia dos Pais, Henrique! 💙`,

`Sabe o que eu mais guardo comigo? Os sábados de pastel na feira. 🥟

Parece uma coisa simples, mas pra mim virou tradição, virou lembrança boa. É um tempo só nosso, sem pressa, só a gente conversando e comendo pastel quentinho.

Espero que a gente ainda tenha muitos e muitos sábados assim pela frente.

Te amo, pai. 💙`,

`Lembra das competições em que você foi comigo? 🏊‍♂️

Das viagens, das madrugadas acordando cedo, de você na arquibancada torcendo, nervoso, mesmo tentando disfarçar. Cada prova que eu nado, uma parte dessa conquista é sua também.

Obrigado por nunca ter me deixado sozinho nessa caminhada. Feliz Dia dos Pais! 🏅💙`,

`Tem um conselho seu que eu carrego comigo até hoje: que eu confie no meu processo, que os resultados vêm com constância e que eu não desista nos dias ruins.

Isso vale pra piscina, mas vale pra vida toda também. Obrigado por me ensinar isso — e por tanta coisa mais que eu nem consigo colocar em palavras.

Feliz Dia dos Pais, pai. Te amo. ❤️`
];

let responseQueue = [];
function nextResponse(){
  if(responseQueue.length === 0){
    responseQueue = responses.map((_, i) => i).sort(() => Math.random() - 0.5);
  }
  const idx = responseQueue.shift();
  return responses[idx];
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function scrollDown(){
  chat.scrollTo({top: chat.scrollHeight, behavior:'smooth'});
}

function addUserMsg(text){
  const row = document.createElement('div');
  row.className = 'msg-user-row';
  row.innerHTML = `<div class="msg-user">${escapeHtml(text)}</div>`;
  chatInner.appendChild(row);
  scrollDown();
}

function addToolBlock(){
  const div = document.createElement('div');
  div.className = 'msg-assistant';
  div.innerHTML = `
    <div class="tool-block" id="toolBlock">
      <div class="tool-head">
        <div class="spinner"></div>
        <span id="toolLabel">Executando...</span>
      </div>
    </div>
  `;
  chatInner.appendChild(div);
  scrollDown();
  return div;
}

function addBotResponse(text){
  const div = document.createElement('div');
  div.className = 'msg-assistant';
  div.innerHTML = `<p><span class="botText"></span><span class="cursor"></span></p>`;
  chatInner.appendChild(div);
  scrollDown();
  const el = div.querySelector('.botText');
  const cursor = div.querySelector('.cursor');
  let i = 0;
  (function type(){
    if(i <= text.length){
      el.textContent = text.slice(0, i);
      i++;
      scrollDown();
      setTimeout(type, 15);
    } else {
      cursor.remove();
      onMessageFinished(div);
    }
  })();
}

function onMessageFinished(afterEl){
  launchConfetti();
  playBellSound();

  const badge = document.createElement('div');
  badge.className = 'inspo-badge';
  badge.innerHTML = `💙 minha inspiração de vida 💙`;
  chatInner.appendChild(badge);

  const shareRow = document.createElement('div');
  shareRow.className = 'share-row';
  shareRow.innerHTML = `<button class="share-btn" id="shareBtn">🔗 Compartilhar esta página</button>`;
  chatInner.appendChild(shareRow);

  scrollDown();
  requestAnimationFrame(() => badge.classList.add('show'));

  const shareBtn = shareRow.querySelector('#shareBtn');
  shareBtn.addEventListener('click', async () => {
    const url = window.location.href;
    try{
      if(navigator.share){
        await navigator.share({ title: 'Feliz Dia dos Pais', url });
      } else {
        await navigator.clipboard.writeText(url);
        shareBtn.textContent = '✓ Link copiado!';
        setTimeout(() => { shareBtn.textContent = '🔗 Compartilhar esta página'; }, 2200);
      }
    } catch(err){
      shareBtn.textContent = '🔗 Compartilhar esta página';
    }
  });
}

let audioCtx = null;
function playBellSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const notes = [1046.5, 1318.5, 1568.0];
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const start = now + i * 0.12;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.9);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + 1);
    });
  } catch(err){}
}

function launchConfetti(){
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';

  const colors = ['#d97757','#4f9eff','#3fb950','#e8b878','#ff6b9d','#ffd166'];
  const pieces = [];
  const count = 160;
  for(let i=0;i<count;i++){
    pieces.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.5,
      w: 6+Math.random()*6,
      h: 8+Math.random()*8,
      color: colors[Math.floor(Math.random()*colors.length)],
      speedY: 2+Math.random()*3,
      speedX: -1.5+Math.random()*3,
      rot: Math.random()*360,
      rotSpeed: -6+Math.random()*12
    });
  }

  let frame = 0;
  const maxFrames = 260;
  function draw(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;
      p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if(frame < maxFrames){
      requestAnimationFrame(draw);
    } else {
      canvas.style.display = 'none';
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
  draw();
}

function handleSend(){
  const text = input.value.trim();
  if(!text) return;
  addUserMsg(text);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  input.disabled = true;

  const blockWrap = addToolBlock();
  const block = blockWrap.querySelector('#toolBlock');
  const label = blockWrap.querySelector('#toolLabel');
  const steps = ["Executando...", "Buscando memórias de infância...", "Gerando resposta com carinho..."];
  let s = 0;
  const stepInterval = setInterval(() => {
    s++;
    if(s < steps.length){
      label.textContent = steps[s];
    }
  }, 550);

  setTimeout(() => {
    clearInterval(stepInterval);
    block.classList.add('done');
    label.textContent = "Concluído";
    const response = nextResponse();
    setTimeout(() => {
      addBotResponse(response);
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }, 300);
  }, 1900);
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
